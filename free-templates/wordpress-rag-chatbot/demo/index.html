<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WordPress AI Chatbot — Demo</title>
<style>
body{font:16px system-ui,sans-serif;max-width:720px;margin:2rem auto;padding:0 1rem}
#messages{min-height:280px;border:1px solid #ccc;border-radius:10px;padding:1rem;overflow:auto}
form{display:flex;gap:.5rem;margin-top:1rem}input{flex:1;padding:.7rem}button{padding:.7rem}
article{margin:.8rem 0;padding:.7rem;background:#f5f5f5;border-radius:8px}
</style>
</head>
<body>
<h1>WordPress AI Chatbot</h1>
<p>This demo calls the WordPress REST proxy on the same origin. Install and configure the WordPress plugin first.</p>
<div id="messages" role="log" aria-live="polite"></div>
<form id="chat-form"><input id="message" maxlength="2000" required placeholder="Ask a question..." aria-label="Message"><button type="submit">Send</button></form>
<script>
const log=document.getElementById('messages');
const form=document.getElementById('chat-form');
const input=document.getElementById('message');
const sessionId=crypto.randomUUID();
function line(text){const p=document.createElement('p');p.textContent=text;log.appendChild(p);}
form.addEventListener('submit',async e=>{
 e.preventDefault();const message=input.value.trim();if(!message)return;input.value='';line('You: '+message);
 const button=form.querySelector('button');button.disabled=true;
 try{
  const response=await fetch('/wp-json/wpaicb/v1/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,sessionId})});
  if(!response.ok)throw new Error('Request failed (HTTP '+response.status+')');
  const data=await response.json();const result=data.output??data;
  if(result.type==='search_results'){
   const list=Array.isArray(result.results)?result.results:[];
   if(!list.length)line('No matching articles found.');
   for(const item of list){const box=document.createElement('article');const a=document.createElement('a');try{const url=new URL(item.url,location.origin);if(!['http:','https:'].includes(url.protocol))throw Error();a.href=url.href;a.target='_blank';a.rel='noopener noreferrer';a.textContent=item.title||'Article';box.appendChild(a);}catch{box.textContent=item.title||'Article';}const p=document.createElement('p');p.textContent=item.summary||'';box.appendChild(p);log.appendChild(box);}
  }else{line('Bot: '+String(result.text??result.message??result.answer??'No response'));}
 }catch(err){line('Error: '+err.message);}finally{button.disabled=false;input.focus();}
});
</script>
</body>
</html>
